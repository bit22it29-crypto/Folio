<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var rawTheme = localStorage.getItem('folio-theme');
          var theme = rawTheme === 'light' ? 'daylight' : (rawTheme === 'dark' || !rawTheme ? 'obsidian' : rawTheme);
          var valid = ['pitch', 'obsidian', 'midnight', 'daylight', 'parchment', 'sepia'];
          if (valid.indexOf(theme) === -1) theme = 'obsidian';
          var isDark = theme === 'pitch' || theme === 'obsidian' || theme === 'midnight';
          if (isDark) root.classList.add('dark');
          else root.classList.remove('dark');
          root.setAttribute('data-theme', theme);

          var contrast = localStorage.getItem('folio-theme-contrast');
          if (contrast !== 'soft' && contrast !== 'high') contrast = 'balanced';
          root.setAttribute('data-contrast', contrast);

          var accent = localStorage.getItem('folio-theme-accent');
          if (['violet', 'amethyst', 'indigo', 'plum'].indexOf(accent) === -1) accent = 'violet';
          root.setAttribute('data-accent', accent);

          var reduced = localStorage.getItem('folio-reduced-motion') === 'true';
          root.setAttribute('data-motion', reduced ? 'reduced' : 'standard');
        } catch (e) {
          root.classList.add('dark');
          root.setAttribute('data-theme', 'obsidian');
          root.setAttribute('data-contrast', 'balanced');
          root.setAttribute('data-accent', 'violet');
          root.setAttribute('data-motion', 'standard');
        }
      })();
    </script>
    <title>Folio — Independent Publishing & Newsletter Network</title>
    <meta
      name="description"
      content="A full-stack editorial publishing platform where writers launch publications, publish long-form essays and subscriber newsletters, share short-form notes, and host reader discussions."
    />
    <meta property="og:title" content="Folio — Independent Publishing & Newsletter Network" />
    <meta
      property="og:description"
      content="A full-stack editorial publishing platform where writers launch publications, publish long-form essays and subscriber newsletters, share short-form notes, and host reader discussions."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[var(--bg-canvas)] text-[var(--text-primary)] antialiased selection:bg-[#8B5CF6]/25 selection:text-[var(--text-heading)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
